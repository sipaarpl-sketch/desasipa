<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Desa Pusaka</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f6f5;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* HEADER NAVBAR */
        .navbar-admin {
            background: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-icon {
            font-size: 1.8rem;
        }
        .brand-text h2 {
            margin: 0;
            color: #1b4d2e;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .brand-text p {
            margin: 0;
            color: #666;
            font-size: 0.8rem;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-nav-website {
            text-decoration: none;
            background: #eaf2ed;
            color: #1b4d2e;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-nav-logout {
            background: #e05252;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* CARD LOGIN */
        .login-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 120px);
        }
        .login-card {
            background: white;
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: #1b4d2e;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #1b4d2e;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        .btn-submit-login {
            width: 100%;
            background: #1b4d2e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit-login:hover {
            background: #143b22;
        }

        /* DASHBOARD CONTENT */
        .dashboard-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .dashboard-header h2 {
            color: #1b4d2e;
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
        }
        .btn-refresh {
            background: #1b4d2e;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .admin-table th, .admin-table td {
            padding: 14px 18px;
            text-align: left;
            font-size: 0.88rem;
            border-bottom: 1px solid #f0f0f0;
        }
        .admin-table th {
            background: #1b4d2e;
            color: white;
            font-weight: 600;
        }
        .reply-box {
            display: flex;
            gap: 6px;
            flex-direction: column;
        }
        .reply-box textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.85rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        .btn-reply {
            background: #1b4d2e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            align-self: flex-end;
        }
    </style>
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header class="navbar-admin">
        <div class="brand">
            <span class="brand-icon">🔒</span>
            <div class="brand-text">
                <h2>ADMIN PANEL</h2>
                <p>Desa Pusaka</p>
            </div>
        </div>
        <div class="nav-buttons">
            <a href="index.html" class="btn-nav-website">🏠 Ke Website</a>
            <button id="btnLogout" onclick="logoutAdmin()" class="btn-nav-logout" style="display: none;">🚪 Logout</button>
        </div>
    </header>

    <!-- FORM LOGIN (Ditampilkan awal jika belum login) -->
    <div id="loginSection" class="login-overlay">
        <div class="login-card">
            <h2>Masuk Admin</h2>
            <form onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <label for="passInput">Password Admin:</label>
                    <input type="password" id="passInput" placeholder="••••••" required autofocus>
                </div>
                <button type="submit" class="btn-submit-login">Masuk</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD DATA (Tersembunyi hingga berhasil login) -->
    <div id="dashboardSection" class="dashboard-container" style="display: none;">
        <div class="dashboard-header">
            <h2>Rekap Aspirasi & Balas Pesan</h2>
            <button onclick="loadDataAdmin()" class="btn-refresh">🔄 Refresh Data</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th style="width: 120px;">Kode</th>
                        <th style="width: 180px;">Waktu & Nama</th>
                        <th style="width: 150px;">Kategori</th>
                        <th>Pesan Warga</th>
                        <th style="width: 280px;">Aksi / Balasan Admin</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #777;">Memuat data dari Google Sheets...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwoO-bZ-iEacDP_2IClbaxFQJeONFlL828PXCHUfv0g5wlwZxvJKACd-2P8ijaX6ary/exec';
        const passwordBenar = "asyifa";

        // Cek status login saat halaman dimuat
        window.onload = function() {
            if (sessionStorage.getItem("isAdminLoggedIn") === "true") {
                tampilkanDashboard();
            }
        };

        function prosesLogin(e) {
            e.preventDefault();
            const input = document.getElementById("passInput").value;

            if (input === passwordBenar) {
                sessionStorage.setItem("isAdminLoggedIn", "true");
                tampilkanDashboard();
            } else {
                alert("Password Admin Salah!");
                document.getElementById("passInput").value = "";
            }
        }

        function tampilkanDashboard() {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("dashboardSection").style.display = "block";
            document.getElementById("btnLogout").style.display = "inline-flex";
            loadDataAdmin();
        }

        function logoutAdmin() {
            sessionStorage.removeItem("isAdminLoggedIn");
            document.getElementById("dashboardSection").style.display = "none";
            document.getElementById("btnLogout").style.display = "none";
            document.getElementById("loginSection").style.display = "flex";
            document.getElementById("passInput").value = "";
        }

        function loadDataAdmin() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #777;">Memuat data terbaru...</td></tr>';

            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #777;">Belum ada pesan masuk.</td></tr>';
                        return;
                    }

                    let html = '';
                    data.reverse().forEach(item => {
                        const kode = item.kode || item.Kode || '-';
                        const nama = item.nama || item.Nama || '-';
                        const hp = item.hp || item.Hp || item.HP || item.WhatsApp || '-';
                        const waktu = item.waktu || item.Waktu || item.Tanggal || item.Timestamp || '-';
                        const kategori = item.kategori || item.Kategori || '-';
                        const pesan = item.pesan || item.Pesan || '-';
                        const balasan = item.balasan || item.Balasan || '';

                        const balasanStatus = balasan && balasan.trim() !== "" 
                            ? `<div style="background:#eaf3ed; padding:8px; border-radius:4px; color:#1b4d2e; margin-bottom:6px;"><strong>Balasan:</strong> ${balasan}</div>` 
                            : `<div style="color:#c9302c; font-weight:600; font-size:0.8rem; margin-bottom:6px;">Belum Dibalas</div>`;

                        html += `
                            <tr>
                                <td><strong style="color:#1b4d2e;">${kode}</strong></td>
                                <td>
                                    <strong>${nama}</strong><br>
                                    <small style="color:#666;">📱 ${hp}</small><br>
                                    <small style="color:#888;">🕒 ${waktu}</small>
                                </td>
                                <td><span style="background:#f0f0f0; padding:4px 8px; border-radius:4px; font-size:0.75rem;">${kategori}</span></td>
                                <td style="line-height:1.4;">${pesan}</td>
                                <td>
                                    <div class="reply-box">
                                        ${balasanStatus}
                                        <textarea id="reply-input-${kode}" rows="2" placeholder="Tulis balasan di sini..."></textarea>
                                        <button onclick="kirimBalasan('${kode}')" class="btn-reply">💾 Kirim Balasan</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });

                    tbody.innerHTML = html;
                })
                .catch(err => {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Gagal memuat data. Silakan coba klik tombol Refresh Data.</td></tr>';
                });
        }

        function kirimBalasan(kode) {
            const inputBalasan = document.getElementById(`reply-input-${kode}`);
            const balasanText = inputBalasan.value.trim();

            if (!balasanText) {
                alert('Tuliskan isi balasan terlebih dahulu!');
                return;
            }

            const params = new URLSearchParams();
            params.append('action', 'reply');
            params.append('kode', kode);
            params.append('balasan', balasanText);

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
            .then(() => {
                alert(`Balasan untuk kode ${kode} berhasil dikirim!`);
                inputBalasan.value = '';
                loadDataAdmin();
            })
            .catch(err => {
                alert('Gagal mengirim balasan. Silakan coba lagi.');
            });
        }
    </script>
</body>
</html>
